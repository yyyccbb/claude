<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线体流转模拟</title>
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1d2433; --ink2:#5b6475; --line:#d9dee7; --soft:#f2f4f8;
  --brand:#1f4e8c; --brand-soft:#e3ecf8; --input:#fffbe6; --input-line:#e6d58a;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#b7791f; --warn-soft:#fdf3dc; --ng:#c0392b; --ng-soft:#fbe5e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --card:#1a2029; --ink:#e6e9ef; --ink2:#9aa3b2; --line:#2e3644; --soft:#222a35;
    --brand:#7fa8e0; --brand-soft:#22324a; --input:#2a2716; --input-line:#5a5226;
    --ok:#4cc27e; --ok-soft:#173226; --warn:#e0b050; --warn-soft:#352b14; --ng:#ef6b5b; --ng-soft:#3a1d1a;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --card:#1a2029; --ink:#e6e9ef; --ink2:#9aa3b2; --line:#2e3644; --soft:#222a35;
  --brand:#7fa8e0; --brand-soft:#22324a; --input:#2a2716; --input-line:#5a5226;
  --ok:#4cc27e; --ok-soft:#173226; --warn:#e0b050; --warn-soft:#352b14; --ng:#ef6b5b; --ng-soft:#3a1d1a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--brand)}
.clock small{font-weight:400;font-size:12.5px;color:var(--ink2);margin-left:6px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;border-radius:7px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.sm{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input.in{background:var(--input);border-color:var(--input-line);width:100%;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;padding:12px;height:calc(100% - 58px)}
@media (max-width:1100px){.main{grid-template-columns:1fr;height:auto}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-height:0}
#cv{width:100%;flex:1;min-height:360px;display:block;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);padding:4px 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:none;padding:9px 4px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.pane{flex:1;overflow:auto;padding:12px;min-height:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--soft);border-radius:8px;padding:8px 10px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:2px}
.kpi .d{font-size:11.5px;color:var(--ink2)}
.kpi.ng .v{color:var(--ng)} .kpi.ok .v{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left}
th{background:var(--soft);font-weight:600;white-space:nowrap;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ubar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--soft);min-width:70px}
.ubar i{display:block;height:100%}
h3{font-size:14px;margin:14px 0 6px}
h3:first-child{margin-top:0}
.sub{color:var(--ink2);font-size:12px}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.msg{padding:7px 10px;border-radius:8px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:13px}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff}
.msg.a{align-self:flex-start;background:var(--soft)}
.msg.sys{align-self:center;background:none;color:var(--ink2);font-size:12px}
.msg .acts{margin-top:5px;font-size:12px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chips button{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--soft)}
.askrow{display:flex;gap:6px}
.askrow textarea{flex:1;resize:vertical;min-height:40px}
.log div{font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.log b{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:500;margin-right:6px}
.log .ng{color:var(--ng)} .log .ok{color:var(--ok)} .log .ai{color:var(--brand)}
details.cfg{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.cfg>summary{cursor:pointer;padding:7px 10px;font-weight:600}
details.cfg .b{padding:0 10px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.grid2 label{font-size:12px;color:var(--ink2);display:block}
table.ed td{padding:2px 3px}
table.ed input{padding:3px 5px}
table.ed input[type=checkbox]{width:16px;height:16px}
.pop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;width:250px;font-size:13px;z-index:5}
.pop h4{margin:0 0 6px;font-size:14px}
.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;border-radius:4px;padding:0 5px;background:var(--soft);color:var(--ink2)}
.hidden{display:none!important}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:12px;margin:6px 0}
</style>
</head>
<body>
<div class="top">
  <h1 id="lineName">线体流转模拟</h1>
  <div class="clock" id="clock">第1天 08:00:00<small></small></div>
  <div class="ctl">
    <button class="pri" id="btnRun">▶ 运行</button>
    <button id="btnReset" title="按当前基础数据重新开始">⟲ 重置</button>
    <label class="sub">倍速</label>
    <select id="speed">
      <option>1</option><option>2</option><option>5</option><option>10</option><option>30</option>
      <option selected>60</option><option>120</option><option>300</option><option>600</option><option>1200</option>
    </select>
    <button id="btnFF" title="不播放动画，直接推进 1 小时">⏩ 快进1小时</button>
  </div>
</div>

<div class="main">
  <div class="stage" style="position:relative">
    <canvas id="cv"></canvas>
    <div class="legend">
      <span><i style="background:#e58a2b"></i>满载工装</span>
      <span><i style="background:none;border:1.5px solid #8a94a6"></i>空工装</span>
      <span><i style="background:#d9473a;border-radius:50%"></i>零件(热)→<i style="background:#3a7bd5;border-radius:50%"></i>(冷)</span>
      <span><i style="background:#2e9d5b"></i>作业中</span>
      <span><i style="background:#e0a92e"></i>堵料/等待下游</span>
      <span><i style="background:#b8c0cc"></i>待料</span>
      <span><i style="background:#c0392b"></i>停机/维修</span>
      <span>点击工位可查看详情或停机</span>
    </div>
    <div class="pop hidden" id="pop"></div>
  </div>

  <div class="side">
    <div class="tabs">
      <button data-tab="dash" class="on">运行看板</button>
      <button data-tab="ai">AI 助手</button>
      <button data-tab="cfg">基础数据</button>
      <button data-tab="log">事件日志</button>
    </div>
    <div class="pane" id="p-dash"></div>
    <div class="pane hidden" id="p-ai">
      <details class="cfg" id="aiCfg">
        <summary>AI 接口设置 <span class="tag" id="aiMode">本地指令解析</span></summary>
        <div class="b">
          <div class="sub" style="margin-bottom:6px">填入 Key 后由大模型理解指令：停机/恢复、调节拍、改放行逻辑、改线体结构与流转方向、回答线体问题；不填则用本地规则解析常用指令。Key 只保存在本机浏览器。</div>
          <label class="sub">接口类型</label>
          <select id="aiProv" style="width:100%"><option value="openai">MiMo / OpenAI 兼容接口</option><option value="claude">Anthropic Claude</option></select>
          <label class="sub">API 地址（OpenAI 兼容填到 /v1；浏览器跨域被拦时填本地转发 http://localhost:8787/v1）</label><input id="aiBase" placeholder="https://api.xiaomimimo.com/v1" style="width:100%">
          <label class="sub">模型（以 MiMo 控制台显示的模型 ID 为准）</label><input id="aiModel" placeholder="mimo-v2-flash" style="width:100%">
          <label class="sub">API Key</label><input type="password" id="aiKey" placeholder="sk-..." style="width:100%">
          <div class="row" style="margin-top:6px;display:flex;gap:6px"><button class="sm" id="aiSave">保存</button><button class="sm" id="aiTest">测试连接</button><button class="sm" id="aiClear">清除 Key</button></div>
        </div>
      </details>
      <div class="chat" id="chat"></div>
      <div class="chips" id="chips"></div>
      <div class="askrow">
        <textarea id="ask" placeholder="例：1通道加热工位维修，暂停运行15分钟"></textarea>
        <button class="pri" id="send">发送</button>
      </div>
    </div>
    <div class="pane hidden" id="p-cfg"></div>
    <div class="pane hidden log" id="p-log"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   线体模型（模板拓扑可编辑）：
   上料段工位链(按工装) → 进料主通道 → 并联通道[工位序列] → 出料主通道 → 脱模
   → 冷却通道(按组前移，可关) → 检测线上料机械手 → 同步检测线 → 人工段工位链 → 成品
   空工装：脱模 → 回流线 → 上料段第一个工位
   放行时间 TimeSpec：{type:"fixed",v} | {type:"uniform",min,max} | {type:"normal",mean,sd} | {type:"tri",min,mode,max}
   ===================================================================== */
const T = v => ({ type: "fixed", v });
const DEFAULT_CFG = {
  name: "定子自粘钢固化线",
  N: 1, tools: 34, dispatch: "nearest", vari: 0.05,
  layout: { mirror: false, ch1: "near" },
  pre: [{ id: "load", name: "上料工位", t: T(80) }, { id: "pre", name: "预压工位", t: T(50) }],
  feedGap: 2, outGap: 2, ret: 95, feedQ: 3,
  channels: [15, 23.5, 43, 51.5, 71, 79.5, 99, 107.5, 127, 135.5].map((x, i) => ({ on: i < 9, tin: x, tout: x })),
  chIndex: "sync",
  chStages: [{ name: "加热固化", t: T(1200) }, { name: "冷却", t: T(1200) }],
  demold: { name: "脱模工位", t: T(117) },
  cool: { on: true, rows: 3, cols: 16, grp: 6, fwd: 12, minStop: 0, r1: 18, req: 600 },
  loader: { name: "检测线上料机械手", t: T(20) },
  insp: { move: 8, st: [["测高", 13.3], ["内径通规", 6.7], ["线槽通规", 11.7], ["打码", 15.6], ["除尘", 14.5], ["", 0]].map((r, i) => ({ on: i < 5, name: r[0], t: T(r[1]) })) },
  post: [{ id: "unload", name: "下料(人工)", t: T(3) }, { id: "visual", name: "目检", t: T(10) }, { id: "pack", name: "装箱", t: T(2), pack: true }],
  postBuf: 5,
  perLayer: 17, layers: 40,
  pack: [["拍照", 10, 2], ["扫码", 80, 2], ["盖中衬", 60, 2], ["挪动包材", 60, 3]].map(r => ({ on: true, name: r[0], t: r[1], f: r[2] })),
  demand: { dem: 18000, use: 1, days: 26, mins: 1320, oee: 0.9 }
};
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

/* ---------- 放行时间 ---------- */
function normT(t) {
  if (t === null || t === undefined || t === "") return T(0);
  if (typeof t === "number" || typeof t === "string") return T(+t || 0);
  const ty = t.type || (t.min !== undefined ? "uniform" : t.mean !== undefined ? "normal" : "fixed");
  if (ty === "uniform") { const a = +t.min || 0, b = +t.max || 0; return { type: "uniform", min: Math.min(a, b), max: Math.max(a, b) }; }
  if (ty === "normal") return { type: "normal", mean: +t.mean || 0, sd: Math.abs(+t.sd || 0) };
  if (ty === "tri") { const xs = [+t.min || 0, +t.mode || 0, +t.max || 0]; return { type: "tri", min: Math.min(...xs), mode: xs[1], max: Math.max(...xs) }; }
  return T(+(t.v ?? t.value ?? 0) || 0);
}
function tMean(t) { t = normT(t); return t.type === "uniform" ? (t.min + t.max) / 2 : t.type === "normal" ? t.mean : t.type === "tri" ? (t.min + t.mode + t.max) / 3 : t.v; }
const rnd = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function tSample(t) {
  t = normT(t);
  if (t.type === "uniform") return t.min + Math.random() * (t.max - t.min);
  if (t.type === "normal") return Math.max(t.mean * 0.2, t.mean + t.sd * rnd());
  if (t.type === "tri") { const u = Math.random(), { min: a, mode: c, max: b } = t; if (b === a) return a; const f = (c - a) / (b - a); return u < f ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c)); }
  const base = t.v; // 固定值：叠加全局工时波动
  if (!CFG.vari || base <= 0) return base;
  return Math.max(base * 0.5, Math.min(base * 1.5, base * (1 + CFG.vari * rnd())));
}
function tText(t) {
  t = normT(t); const f = x => +(+x).toFixed(2);
  return t.type === "uniform" ? `${f(t.min)}~${f(t.max)}s` : t.type === "normal" ? `${f(t.mean)}±${f(t.sd)}s` : t.type === "tri" ? `${f(t.min)}/${f(t.mode)}/${f(t.max)}s` : `${f(t.v)}s`;
}
const T_NAMES = { fixed: "固定", uniform: "区间均匀波动", normal: "正态波动", tri: "三角分布" };

/* ---------- 配置规范化（AI/表格修改后统一走这里） ---------- */
let uid = 1;
function normCfg(c) {
  const d = DEFAULT_CFG, o = Object.assign(clone(d), c || {});
  o.layout = Object.assign(clone(d.layout), o.layout || {});
  o.cool = Object.assign(clone(d.cool), o.cool || {});
  o.insp = Object.assign(clone(d.insp), o.insp || {});
  o.demand = Object.assign(clone(d.demand), o.demand || {});
  o.N = Math.max(1, Math.round(+o.N || 1));
  o.tools = Math.max(1, Math.round(+o.tools || 1));
  const ids = new Set();
  const fixSt = (s, pfx) => { s = Object.assign({}, s); s.t = normT(s.t); s.name = String(s.name || "工位"); if (!s.id || ids.has(s.id)) s.id = pfx + (uid++); ids.add(s.id); return s; };
  o.pre = (Array.isArray(o.pre) && o.pre.length ? o.pre : clone(d.pre)).map(s => fixSt(s, "p"));
  o.post = (Array.isArray(o.post) ? o.post : clone(d.post)).map(s => fixSt(s, "q"));
  o.chStages = (Array.isArray(o.chStages) && o.chStages.length ? o.chStages : clone(d.chStages)).map(s => ({ name: String(s.name || "通道工位"), t: normT(s.t) }));
  o.channels = (Array.isArray(o.channels) && o.channels.length ? o.channels : clone(d.channels)).map(x => ({ on: x.on !== false, tin: +x.tin || 0, tout: +x.tout || 0 }));
  o.chIndex = o.chIndex === "async" ? "async" : "sync";
  o.demold = { name: (o.demold && o.demold.name) || "脱模工位", t: normT(o.demold && o.demold.t) };
  o.loader = { name: (o.loader && o.loader.name) || "检测线上料机械手", t: normT(o.loader && o.loader.t) };
  o.insp.st = (o.insp.st || []).map(s => ({ on: s.on !== false, name: String(s.name || ""), t: normT(s.t) }));
  o.dispatch = ["nearest", "roundrobin", "farthest"].includes(o.dispatch) ? o.dispatch : "nearest";
  o.layout.ch1 = o.layout.ch1 === "far" ? "far" : "near"; o.layout.mirror = !!o.layout.mirror;
  return o;
}
let CFG = normCfg(store.get("lsx-sim-cfg2") || DEFAULT_CFG);
const structSig = c => JSON.stringify([c.N, c.pre.map(s => s.id), c.chStages.length, c.channels.length, c.cool.on, c.cool.rows, c.cool.cols, c.cool.grp, c.insp.st.map(s => s.on), c.post.map(s => s.id)]);

/* ================= 理论节拍（同节拍分析表口径，波动取均值） ================= */
function theory(c) {
  const N = c.N, on = c.channels.filter(x => x.on), n = on.length, K = c.chStages.length;
  const stMax = Math.max(...c.chStages.map(s => tMean(s.t)));
  const par = n ? stMax / (n * N) : 0;
  const stay = c.chIndex === "sync" ? K * stMax : c.chStages.reduce((a, s) => a + tMean(s.t), 0);
  const avg = k => n ? on.reduce((s, x) => s + x[k], 0) / n : 0;
  const preSum = c.pre.reduce((a, s) => a + tMean(s.t), 0);
  const loop = (n ? avg("tin") + stay + avg("tout") : 0) + preSum + tMean(c.demold.t) + c.ret;
  const toolCT = c.tools ? loop / (c.tools * N) : 0;
  const cure = Math.max(par, c.feedGap / N, c.outGap / N, toolCT);
  const cl = c.cool, cap = cl.rows * cl.cols, r2 = tMean(c.loader.t);
  const cool = cl.on ? Math.max(cl.grp ? (Math.max(cl.minStop, cl.grp * Math.max(cl.r1, r2)) + cl.fwd) / cl.grp : 0, cap ? cl.req / cap : 0) : r2;
  const ins = c.insp.st.filter(s => s.on);
  const insp = ins.length ? Math.max(...ins.map(s => tMean(s.t))) + c.insp.move : 0;
  const perBox = c.perLayer * c.layers;
  const per = c.pack.filter(p => p.on).reduce((s, p) => s + p.t / (p.f == 3 ? (perBox || 1) : p.f == 2 ? (c.perLayer || 1) : 1), 0);
  const man = Math.max(0, ...c.post.map(s => tMean(s.t) + (s.pack ? per : 0)));
  const lpd = Math.max(...c.pre.map(s => tMean(s.t)), tMean(c.demold.t)) / N;
  const segs = [["固化通道段", cure], ["检测段", insp], [cl.on ? "冷却段" : "检测上料", cool], ["人工段", man], ["上料段/脱模", lpd]];
  const LT = Math.max(...segs.map(s => s[1]));
  const d = c.demand, TT = d.dem ? d.days * d.mins * 60 / (d.dem * (d.use || 1)) : 0;
  return { LT, src: (segs.find(s => s[1] === LT) || ["—"])[0], segs, target: TT * (d.oee || 1), loop, toolCT, par };
}

/* ================= 仿真引擎 ================= */
const DT = 0.5;
let S = null;
const ST0 = () => ({ work: 0, block: 0, idle: 0, down: 0 });
function mkSrv(id, name) { return { id, name, ent: null, rem: 0, done: false, st: ST0() }; }
const inspStations = () => CFG.insp.st.map((s, i) => ({ ...s, i })).filter(s => s.on);

function resetSim() {
  const c = CFG, prevLog = S ? S.log : [], running = S ? S.running : false;
  S = {
    t: 0, running, nextId: 1, out: 0, outTimes: [], hourly: [], coolTimes: [], down: {}, scheduled: [],
    retBuf: [], ret: [], feedQ: [], feed: [], out_: [], demQ: [], pickQ: [], toolDeficit: 0,
    lastFeed: -1e9, lastOut: -1e9, rr: 0, packCount: 0, log: prevLog,
    pre: c.pre.map(s => mkSrv(s.id, s.name)),

function parseTimeSpec(s) {

  if ((m = /(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*[±]\s*(\d+(?:\.\d+)?)/.exec(s))) return { type: "normal", mean: +m[1], sd: +m[2] };
  if ((m = /均值\s*(\d+(?:\.\d+)?).*?(?:标准差|σ|sd)\s*(\d+(?:\.\d+)?)/i.exec(s))) return { type: "normal", mean: +m[1], sd: +m[2] };

}

function rollTakt(n) { const o = S.outTimes; if (o.length < n + 1) return 0; return (o[o.length - 1] - o[o.length - 1 - n]) / n; }
function avgTakt() { const o = S.outTimes; if (o.length < 6) return 0; const from = Math.min(5, o.length - 2); return (o[o.length - 1] - o[from]) / (o.length - 1 - from); }
function utilOf(st) { const tot = st.work + st.block + st.idle + st.down || 1; return { work: st.work / tot, block: st.block / tot, idle: st.idle / tot, down: st.down / tot }; }
function stationRows() {
  const rows = [], sName = { work: "作业", block: "堵料", idle: "待料", down: "停机" };
  const push = (id, name, st, state) => rows.push({ id, name, u: utilOf(st), state });
  CFG.pre.forEach((s, j) => push(s.id, s.name, S.pre[j].st, sName[srvState(S.pre[j])]));
  S.ch.forEach((ch, i) => {
    if (!CFG.channels[i].on && !ch.pos.some(Boolean)) return;
    const st = ST0(); ch.posSt.forEach(x => Object.keys(st).forEach(k => st[k] += x[k]));
    push(`ch${i + 1}`, `${i + 1}通道`, st, ch.pos.map((p, k) => isDown(chId(i, k)) || isDown(`ch${i + 1}`) ? "停" : p ? (p.rem > 0 ? "作" : "堵") : "空").join("/"));
  });
  push("demold", CFG.demold.name, S.demold.st, sName[srvState(S.demold)]);
  if (CFG.cool.on) push("cooler", "冷却通道(前移)", S.cool.st, isDown("cooler") ? "停机" : S.cool.idxRem ? "前移" : "—");
  push("loader", CFG.loader.name, S.loader.st, sName[srvState(S.loader)]);
  inspStations().forEach((s, j) => push("insp" + (s.i + 1), "检测·" + (s.name || s.i + 1), S.insp.posSt[j], isDown("insp" + (s.i + 1)) ? "停机" : S.insp.pos[j] ? (S.insp.pos[j].rem > 0 ? "作业" : "等移栽") : "空"));
  CFG.post.forEach((s, j) => push(s.id, s.name, S.post[j].st, sName[srvState(S.post[j])]));
  return rows;
}

  const f = (k, ph) => `<input class="in" style="width:62px" data-tv="${path}" data-tk="${k}" type="number" step="any" placeholder="${ph}" value="${t[k] ?? ""}">`;
  const fields = t.type === "uniform" ? f("min", "下限") + f("max", "上限") : t.type === "normal" ? f("mean", "均值") + f("sd", "标准差") : t.type === "tri" ? f("min", "最小") + f("mode", "最可能") + f("max", "最大") : f("v", "秒");

// 读取《节拍分析表》9.2 基础数据录入（自粘钢固化线 15 列版单元格位置）
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("加载失败 " + src)); document.head.appendChild(s); }); }
async function importXlsx(file) {
  try {
    if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const ws = wb.Sheets["9.2 基础数据录入"];
    if (!ws) throw new Error("没有找到「9.2 基础数据录入」工作表");
    const v = a => { const x = ws[a]; return x ? x.v : undefined; };
    const n = (a, d = 0) => { const x = parseFloat(v(a)); return isFinite(x) ? x : d; };
    if (!/固化/.test(String(v("B2") || "")) && v("E57") === undefined) throw new Error("该表不是自粘钢固化线节拍分析表（9.2 区结构不符）");
    const c = clone(DEFAULT_CFG), pc = wb.Sheets["过程确认"];
    c.name = (pc && pc.B30 && pc.B30.v) || (/转子/.test(String(v("B2"))) ? "转子自粘钢固化线" : "定子自粘钢固化线");
    c.demand = { dem: n("E10"), use: n("E11", 1), days: n("E13", 26), mins: n("E14", 1320), oee: n("E15", 0.85) };
    const mode = n("E25", 2) === 1 ? 1 : 2;
    const Tch = n("E26") > 0 ? n("E26") : (mode === 2 ? Math.max(n("E23"), n("E24")) : n("E23") + n("E24"));
    c.chStages = mode === 2 ? [{ name: "加热固化", t: T(Tch) }, { name: "冷却", t: T(Tch) }] : [{ name: "加热固化", t: T(Tch) }];
    c.N = n("E27", 1) || 1;
    c.channels = []; for (let r = 36; r <= 45; r++) c.channels.push({ on: n("C" + r) === 1, tin: n("D" + r), tout: n("E" + r) });
    c.feedGap = n("E48"); c.outGap = n("E49");
    c.pre = [{ id: "load", name: "上料工位", t: T(n("E57")) }, { id: "pre", name: "预压工位", t: T(n("E59")) }];
    c.demold = { name: "脱模工位", t: T(n("E61")) }; c.ret = n("E67"); c.tools = n("E69", 20);
    c.cool = { on: true, rows: n("E82", 3), cols: n("E83", 16), grp: n("E84", 6), fwd: n("E85"), minStop: n("E86"), r1: n("E87"), req: n("E93") };
    c.loader = { name: "检测线上料机械手", t: T(n("E88")) };
    c.insp.move = n("E100"); c.insp.st = [];
    for (let r = 102; r <= 107; r++) c.insp.st.push({ on: n("C" + r) === 1, name: String(v("D" + r) || ""), t: T(n("E" + r)) });
    c.post = [{ id: "unload", name: "下料(人工)", t: T(n("E116")) }, { id: "visual", name: "目检", t: T(n("E117")) }, { id: "pack", name: "装箱", t: T(n("E118")), pack: true }];
    c.perLayer = n("E119", 1); c.layers = n("E120", 1);
    c.pack = []; for (let r = 125; r <= 134; r++) { const nm = v("D" + r); if (nm === undefined && !n("E" + r)) continue; c.pack.push({ on: n("C" + r) === 1, name: String(nm || ""), t: n("E" + r), f: n("F" + r, 1) }); }
    CFG = normCfg(c); saveCfg(); resetSim(); renderAll();
    logEv(`已导入「${file.name}」：T_ch ${Tch}s，${CFG.channels.filter(x => x.on).length} 通道，工装 ${CFG.tools} 套，N=${CFG.N}`, "ok");
  } catch (err) { alert("导入失败：" + err.message); }
}

/* ================= 日志 / 聊天 UI ================= */
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function logEv(msg, cls) {
  if (!S) return; S.log.push({ t: S.t, msg, cls }); if (S.log.length > 400) S.log.shift();
  if (!document.getElementById("p-log").classList.contains("hidden")) renderLog();
}
function renderLog() { document.getElementById("p-log").innerHTML = S.log.slice().reverse().map(e => `<div class="${e.cls || ""}"><b>${fmtClock(e.t)}</b>${esc(e.msg)}</div>`).join("") || '<div class="sub">暂无事件</div>'; }
function addMsg(cls, txt, acts, src) {
  const d = document.createElement("div"); d.className = "msg " + cls;
  d.innerHTML = esc(txt) + (acts && acts.length ? `<div class="acts">${acts.map(esc).join("<br>")}</div>` : "") + (src ? `<div class="acts">— ${esc(src)} · ${clockText()}</div>` : "");
  const ch = document.getElementById("chat"); ch.appendChild(d); ch.parentElement.scrollTop = 1e9; return d;
}

/* ================= 主循环 ================= */
let SPEED = 60, lastFrame = 0, acc = 0, uiTick = 0;
function setSpeed(x) { if (!(x > 0)) return; SPEED = Math.min(3000, x); const sel = document.getElementById("speed"); if (![...sel.options].some(o => +o.value === SPEED)) sel.add(new Option(SPEED, SPEED)); sel.value = SPEED; logEv("倍速 " + SPEED + "×", ""); }
function setRun(on) { S.running = on; document.getElementById("btnRun").textContent = on ? "⏸ 暂停" : "▶ 运行"; }
function fastForward(sec) { const n = Math.round(sec / DT); for (let i = 0; i < n; i++) step(); logEv("快进 " + fmtDur(sec), ""); renderAll(); }
function frame(ts) {
  const dt = lastFrame ? Math.min(0.1, (ts - lastFrame) / 1000) : 0; lastFrame = ts;
  if (S.running) { acc += dt * SPEED; let n = 0; while (acc >= DT && n < 6000) { step(); acc -= DT; n++; } if (n >= 6000) acc = 0; }
  draw();
  document.getElementById("clock").innerHTML = clockText() + `<small>已运行 ${fmtDur(S.t)}</small>`;
  if (ts - uiTick > 500) { uiTick = ts; if (!document.getElementById("p-dash").classList.contains("hidden")) renderDash(); if (!document.getElementById("p-log").classList.contains("hidden")) renderLog(); updatePop(); }
  requestAnimationFrame(frame);
}
function renderAll() { document.getElementById("lineName").textContent = CFG.name + " · 流转模拟"; renderDash(); renderCfg(); renderLog(); }
function saveCfg() { store.set("lsx-sim-cfg2", CFG); }

/* ---- 点击工位弹窗 ---- */
let popId = null;
function updatePop() {
  const pop = document.getElementById("pop");
  if (!popId) { pop.classList.add("hidden"); return; }
  const d = S.down[popId], row = stationRows().find(r => r.id === popId || r.id === popId.split(".")[0]);
  const pi = pop.querySelector(".pi"); if (!pi) return;
  pi.innerHTML = `${d ? `<span style="color:var(--ng)">${esc(d.reason)}中 · ${d.until === Infinity ? "待恢复" : "剩 " + fmtClock(d.until - S.t)}</span><br>` : ""}${row ? `作业率 ${pct(row.u.work)} · 堵料 ${pct(row.u.block)} · 待料 ${pct(row.u.idle)} · 停机 ${pct(row.u.down)}` : ""}`;
}
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - offX) / scale, y = (e.clientY - r.top - offY) / scale;
  const h = HIT.slice().reverse().find(o => x >= o.r.x && x <= o.r.x + o.r.w && y >= o.r.y && y <= o.r.y + o.r.h);
  const pop = document.getElementById("pop");
  if (!h) { popId = null; pop.classList.add("hidden"); return; }
  popId = h.id;
  pop.innerHTML = `<h4>${esc(targetName(h.id))}</h4><div class="pi sub"></div>
    <div class="row"><button class="sm" data-m="10">停 10 分钟</button><button class="sm" data-m="30">停 30 分钟</button><button class="sm" data-m="0">停机待恢复</button><button class="sm" data-r="1">恢复</button><button class="sm" data-x="1">关闭</button></div>`;
  const stage = cv.parentElement.getBoundingClientRect();
  pop.style.left = Math.max(0, Math.min(stage.width - 260, e.clientX - stage.left + 8)) + "px"; pop.style.top = Math.max(0, Math.min(stage.height - 140, e.clientY - stage.top + 8)) + "px";
  pop.classList.remove("hidden");
  pop.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { applyAction({ op: "stop", target: h.id, minutes: +b.dataset.m, text: "停机" }); updatePop(); });
  pop.querySelector("[data-r]").onclick = () => { applyAction({ op: "resume", target: h.id }); updatePop(); };
  pop.querySelector("[data-x]").onclick = () => { popId = null; pop.classList.add("hidden"); };
  updatePop();
});

/* ---- 绑定 ---- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("hidden", p.id !== "p-" + b.dataset.tab));
  if (b.dataset.tab === "log") renderLog(); if (b.dataset.tab === "dash") renderDash();
});
document.getElementById("btnRun").onclick = () => setRun(!S.running);
document.getElementById("btnReset").onclick = () => { resetSim(); renderAll(); };
document.getElementById("speed").onchange = e => { SPEED = +e.target.value; };
document.getElementById("btnFF").onclick = () => fastForward(3600);
document.getElementById("send").onclick = () => { const t = document.getElementById("ask"); send(t.value); t.value = ""; };
document.getElementById("ask").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("send").click(); } });
const CHIPS = ["1通道加热工位维修，暂停运行15分钟", "固化通道增加一个冷却工位，变成加热固化-冷却1-冷却2", "冷却1 900s放行更改为900~1000秒之间波动", "在预压后增加打码工位，30秒", "流转方向改为从右向左", "通道改为各位独立放行", "脱模工位故障停机20分钟", "工装数改为40", "全部恢复", "现在瓶颈在哪？"];
document.getElementById("chips").innerHTML = CHIPS.map(c => `<button>${c}</button>`).join("");
document.querySelectorAll("#chips button").forEach(b => b.onclick = () => { const a = document.getElementById("ask"); a.value = b.textContent; a.focus(); });
function syncAiUi() {
  const d = AI_DEF[AI.prov] || AI_DEF.openai;
  document.getElementById("aiProv").value = AI.prov;
  document.getElementById("aiKey").value = AI.key; document.getElementById("aiBase").value = AI.base; document.getElementById("aiModel").value = AI.model;
  document.getElementById("aiBase").placeholder = d.base || "https://api.anthropic.com"; document.getElementById("aiModel").placeholder = d.model;
  document.getElementById("aiMode").textContent = AI.key ? (AI.prov === "claude" ? "Claude 已配置" : (AI.model || d.model) + " 已配置") : "本地指令解析";
}
const readAiUi = () => { AI.prov = document.getElementById("aiProv").value; AI.key = document.getElementById("aiKey").value.trim(); AI.base = document.getElementById("aiBase").value.trim(); AI.model = document.getElementById("aiModel").value.trim(); store.set("lsx-sim-ai2", AI); syncAiUi(); };
document.getElementById("aiProv").onchange = () => { AI.prov = document.getElementById("aiProv").value; AI.base = ""; AI.model = ""; syncAiUi(); };
document.getElementById("aiSave").onclick = () => { readAiUi(); addMsg("sys", AI.key ? "已保存，后续指令交给大模型处理。" : "未填 Key，使用本地规则解析。"); };
document.getElementById("aiTest").onclick = async () => {
  readAiUi(); if (!AI.key) return addMsg("sys", "请先填 API Key。");
  const p = addMsg("sys", "测试连接中…");
  try {
    const raw = AI.prov === "claude" ? await callClaude([{ role: "user", content: "连通性测试，只回复 {\"reply\":\"OK\",\"actions\":[]}" }]) : await callOpenAI([{ role: "user", content: "连通性测试，只回复 {\"reply\":\"OK\",\"actions\":[]}" }]);
    p.textContent = "连接成功，模型答复：" + parseJSONReply(raw).reply;
  } catch (e) { p.textContent = "连接失败：" + e.message + "。若提示 Failed to fetch 多为浏览器跨域拦截，可运行同目录 ai-proxy.js 后把 API 地址填为 http://localhost:8787/v1。"; }
};
document.getElementById("aiClear").onclick = () => { AI.key = ""; store.set("lsx-sim-ai2", AI); syncAiUi(); };
window.addEventListener("resize", resize);

resetSim(); syncAiUi(); renderAll(); resize();
addMsg("sys", "用中文下指令干预线体：停机/恢复、调节拍、改放行逻辑（如 900~1000 秒波动）、增删工位、改流转方向。点击画面中的工位也可直接停机/恢复。");
requestAnimationFrame(frame);
</script>
