<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线体流转模拟</title>
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1d2433; --ink2:#5b6475; --line:#d9dee7; --soft:#f2f4f8;
  --brand:#1f4e8c; --brand-soft:#e3ecf8; --input:#fffbe6; --input-line:#e6d58a;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#b7791f; --warn-soft:#fdf3dc; --ng:#c0392b; --ng-soft:#fbe5e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --card:#1a2029; --ink:#e6e9ef; --ink2:#9aa3b2; --line:#2e3644; --soft:#222a35;
    --brand:#7fa8e0; --brand-soft:#22324a; --input:#2a2716; --input-line:#5a5226;
    --ok:#4cc27e; --ok-soft:#173226; --warn:#e0b050; --warn-soft:#352b14; --ng:#ef6b5b; --ng-soft:#3a1d1a;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --card:#1a2029; --ink:#e6e9ef; --ink2:#9aa3b2; --line:#2e3644; --soft:#222a35;
  --brand:#7fa8e0; --brand-soft:#22324a; --input:#2a2716; --input-line:#5a5226;
  --ok:#4cc27e; --ok-soft:#173226; --warn:#e0b050; --warn-soft:#352b14; --ng:#ef6b5b; --ng-soft:#3a1d1a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--brand)}
.clock small{font-weight:400;font-size:12.5px;color:var(--ink2);margin-left:6px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;border-radius:7px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.sm{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input.in{background:var(--input);border-color:var(--input-line);width:100%;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;padding:12px;height:calc(100% - 58px)}
@media (max-width:1100px){.main{grid-template-columns:1fr;height:auto}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-height:0}
#cv{width:100%;flex:1;min-height:360px;display:block;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);padding:4px 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:none;padding:9px 4px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.pane{flex:1;overflow:auto;padding:12px;min-height:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--soft);border-radius:8px;padding:8px 10px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:2px}
.kpi .d{font-size:11.5px;color:var(--ink2)}
.kpi.ng .v{color:var(--ng)} .kpi.ok .v{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left}
th{background:var(--soft);font-weight:600;white-space:nowrap;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ubar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--soft);min-width:70px}
.ubar i{display:block;height:100%}
h3{font-size:14px;margin:14px 0 6px}
h3:first-child{margin-top:0}
.sub{color:var(--ink2);font-size:12px}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.msg{padding:7px 10px;border-radius:8px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:13px}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff}
.msg.a{align-self:flex-start;background:var(--soft)}
.msg.sys{align-self:center;background:none;color:var(--ink2);font-size:12px}
.msg .acts{margin-top:5px;font-size:12px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chips button{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--soft)}
.askrow{display:flex;gap:6px}
.askrow textarea{flex:1;resize:vertical;min-height:40px}
.log div{font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.log b{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:500;margin-right:6px}
.log .ng{color:var(--ng)} .log .ok{color:var(--ok)} .log .ai{color:var(--brand)}
details.cfg{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.cfg>summary{cursor:pointer;padding:7px 10px;font-weight:600}
details.cfg .b{padding:0 10px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.grid2 label{font-size:12px;color:var(--ink2);display:block}
table.ed td{padding:2px 3px}
table.ed input{padding:3px 5px}
table.ed input[type=checkbox]{width:16px;height:16px}
.pop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;width:250px;font-size:13px;z-index:5}
.pop h4{margin:0 0 6px;font-size:14px}
.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;border-radius:4px;padding:0 5px;background:var(--soft);color:var(--ink2)}
.hidden{display:none!important}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:12px;margin:6px 0}
</style>
</head>
<body>
<div class="top">
  <h1 id="lineName">线体流转模拟</h1>
  <div class="clock" id="clock">第1天 08:00:00<small></small></div>
  <div class="ctl">
    <button class="pri" id="btnRun">▶ 运行</button>
    <button id="btnReset" title="按当前基础数据重新开始">⟲ 重置</button>
    <label class="sub">倍速</label>
    <select id="speed">
      <option>1</option><option>2</option><option>5</option><option>10</option><option>30</option>
      <option selected>60</option><option>120</option><option>300</option><option>600</option><option>1200</option>
    </select>
    <button id="btnFF" title="不播放动画，直接推进 1 小时">⏩ 快进1小时</button>
  </div>
</div>

<div class="main">
  <div class="stage" style="position:relative">
    <canvas id="cv"></canvas>
    <div class="legend">
      <span><i style="background:#e58a2b"></i>满载工装</span>
      <span><i style="background:none;border:1.5px solid #8a94a6"></i>空工装</span>
      <span><i style="background:#d9473a;border-radius:50%"></i>零件(热)→<i style="background:#3a7bd5;border-radius:50%"></i>(冷)</span>
      <span><i style="background:#2e9d5b"></i>作业中</span>
      <span><i style="background:#e0a92e"></i>堵料/等待下游</span>
      <span><i style="background:#b8c0cc"></i>待料</span>
      <span><i style="background:#c0392b"></i>停机/维修</span>
      <span>点击工位可查看详情或停机</span>
    </div>
    <div class="pop hidden" id="pop"></div>
  </div>

  <div class="side">
    <div class="tabs">
      <button data-tab="dash" class="on">运行看板</button>
      <button data-tab="ai">AI 助手</button>
      <button data-tab="cfg">基础数据</button>
      <button data-tab="log">事件日志</button>
    </div>
    <div class="pane" id="p-dash"></div>
    <div class="pane hidden" id="p-ai">
      <details class="cfg" id="aiCfg">
        <summary>AI 接口设置 <span class="tag" id="aiMode">本地指令解析</span></summary>
        <div class="b">
          <div class="sub" style="margin-bottom:6px">填入 Anthropic API Key 后由 Claude 理解指令、调节拍、改运行逻辑、回答线体问题；不填则用本地规则解析常用指令（停机/恢复/改节拍/倍速/开关通道/工装数）。Key 只保存在本机浏览器。</div>
          <label class="sub">API Key</label><input type="password" id="aiKey" placeholder="sk-ant-..." style="width:100%">
          <label class="sub">API 地址（可空；公司代理/网关地址填这里）</label><input id="aiBase" placeholder="https://api.anthropic.com" style="width:100%">
          <label class="sub">模型</label><input id="aiModel" value="claude-opus-5-5" style="width:100%">
          <div class="row" style="margin-top:6px"><button class="sm" id="aiSave">保存</button> <button class="sm" id="aiClear">清除 Key</button></div>
        </div>
      </details>
      <div class="chat" id="chat"></div>
      <div class="chips" id="chips"></div>
      <div class="askrow">
        <textarea id="ask" placeholder="例：1通道加热工位维修，暂停运行15分钟"></textarea>
        <button class="pri" id="send">发送</button>
      </div>
    </div>
    <div class="pane hidden" id="p-cfg"></div>
    <div class="pane hidden log" id="p-log"></div>
  </div>
</div>

<script>
"use strict";
/* ================= 基础数据（默认 = 定子自粘钢固化线 节拍分析表 9.2 区现值） ================= */
const DEFAULT_CFG = {
  name: "定子自粘钢固化线",
  N: 1, mode: 2, Tch: 1200,
  channels: [15, 23.5, 43, 51.5, 71, 79.5, 99, 107.5, 127, 135.5].map((x, i) => ({ on: i < 9, tin: x, tout: x })),
  gapIn: 2, gapOut: 2,
  load: 80, pre: 50, demold: 117, ret: 95, tools: 34,
  cool: { rows: 3, cols: 16, grp: 6, fwd: 12, minStop: 0, r1: 18, r2: 20, req: 600 },
  insp: { move: 8, st: [["测高", 13.3], ["内径通规", 6.7], ["线槽通规", 11.7], ["打码", 15.6], ["除尘", 14.5], ["", 0]].map((r, i) => ({ on: i < 5, name: r[0], t: r[1] })) },
  unload: 3, visual: 10, place: 2, perLayer: 17, layers: 40,
  pack: [["拍照", 10, 2], ["扫码", 80, 2], ["盖中衬", 60, 2], ["挪动包材", 60, 3]].map(r => ({ on: true, name: r[0], t: r[1], f: r[2] })),
  buf: { feedQ: 3, unl: 5, vis: 5, pack: 5 },
  dispatch: "nearest", vari: 0.05,
  demand: { dem: 18000, use: 1, days: 26, mins: 1320, oee: 0.9 }
};
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
let CFG = Object.assign(clone(DEFAULT_CFG), store.get("lsx-sim-cfg") || {});

/* ================= 理论节拍（同节拍分析表口径） ================= */
function theory(c) {
  const N = c.N || 1, on = c.channels.filter(x => x.on), n = on.length;
  const par = n ? c.Tch / (n * N) : 0;
  const stay = c.mode === 2 ? 2 * c.Tch : c.Tch;
  const avg = k => n ? on.reduce((s, x) => s + (+x[k] || 0), 0) / n : 0;
  const loop = (n ? avg("tin") + stay + avg("tout") : 0) + c.load + c.pre + c.demold + c.ret;
  const toolCT = c.tools ? loop / (c.tools * N) : 0;
  const cure = Math.max(par, c.gapIn / N, c.gapOut / N, toolCT);
  const cl = c.cool, cap = cl.rows * cl.cols;
  const cool = Math.max(cl.grp ? (Math.max(cl.minStop, cl.grp * Math.max(cl.r1, cl.r2)) + cl.fwd) / cl.grp : 0, cap ? cl.req / cap : 0);
  const ins = c.insp.st.filter(s => s.on);
  const insp = ins.length ? Math.max(...ins.map(s => +s.t || 0)) + c.insp.move : 0;
  const perBox = c.perLayer * c.layers;
  const per = c.pack.filter(p => p.on).reduce((s, p) => s + p.t / (p.f == 3 ? (perBox || 1) : p.f == 2 ? (c.perLayer || 1) : 1), 0);
  const man = Math.max(c.unload, c.visual, c.place + per);
  const lpd = Math.max(c.load, c.pre, c.demold) / N;
  const segs = [["固化段", cure], ["检测段", insp], ["冷却段", cool], ["人工段", man], ["上料/预压/脱模", lpd]];
  const LT = Math.max(...segs.map(s => s[1]));
  const d = c.demand, TT = d.dem ? d.days * d.mins * 60 / (d.dem * (d.use || 1)) : 0;
  return { LT, src: (segs.find(s => s[1] === LT) || ["—"])[0], segs, target: TT * (d.oee || 1), loop, toolCT, par };
}

/* ================= 仿真引擎 ================= */
const DT = 0.5;
let S = null;
const rnd = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const vt = base => { if (!CFG.vari || base <= 0) return base; return Math.max(base * 0.5, Math.min(base * 1.5, base * (1 + CFG.vari * rnd()))); };

function mkSrv(id, name) { return { id, name, ent: null, rem: 0, done: false, st: { work: 0, block: 0, idle: 0, down: 0 } }; }

function inspStations() { return CFG.insp.st.map((s, i) => ({ ...s, i })).filter(s => s.on); }

function resetSim() {
  const c = CFG;
  S = {
    t: 0, running: S ? S.running : false, nextId: 1, out: 0, outTimes: [], hourly: [], coolTimes: [], down: {}, scheduled: [],
    retBuf: [], ret: [], feedQ: [], feed: [], out_: [], demQ: [], unlQ: [], visQ: [], packQ: [], toolDeficit: 0,
    lastFeed: -1e9, lastOut: -1e9, rr: 0, packCount: 0,
    srv: {}, ch: [], log: S ? S.log : [],
  };
  const add = (id, name) => S.srv[id] = mkSrv(id, name);
  add("load", "上料工位"); add("pre", "预压工位"); add("demold", "脱模工位"); add("loader", "检测线上料机械手");
  add("unload", "下料(人工)"); add("visual", "目检"); add("pack", "装箱");
  c.channels.forEach((ch, i) => {
    S.ch.push({ heat: mkSrv(`ch${i + 1}.heat`, `${i + 1}通道 加热位`), cool: mkSrv(`ch${i + 1}.cool`, `${i + 1}通道 冷却位`), resv: false, entry: null });
  });
  const G = Math.max(2, Math.floor(c.cool.rows * c.cool.cols / Math.max(1, c.cool.grp)));
  S.cool = { G, groups: Array.from({ length: G }, () => []), idxRem: 0, lastIdx: -1e9, st: { work: 0, block: 0, idle: 0, down: 0 } };
  const k = inspStations().length;
  S.insp = { pos: Array(k).fill(null), nest: null, phase: "work", rem: 0, st: { work: 0, block: 0, idle: 0, down: 0 }, posSt: Array.from({ length: k }, () => ({ work: 0, block: 0, idle: 0, down: 0 })) };
  for (let i = 0; i < c.tools; i++) S.retBuf.push({ id: S.nextId++, n: 0 });
  logEv("按当前基础数据重置：" + c.tools + " 套工装，" + c.channels.filter(x => x.on).length + " 个通道在用", "");
}

const isDown = id => { const d = S.down[id]; return !!d && d.until > S.t; };
function downAny(...ids) { return ids.some(isDown); }

function tickSrv(s, extraDown) {
  const dn = isDown(s.id) || extraDown;
  if (dn) s.st.down += DT;
  else if (s.ent && !s.done) s.st.work += DT;
  else if (s.ent && s.done) s.st.block += DT;
  else s.st.idle += DT;
  if (s.ent && !s.done && !dn) { s.rem -= DT; if (s.rem <= 0) s.done = true; }
}
const free = s => !s.ent;
const take = (s, ent, time) => { s.ent = ent; s.rem = time; s.done = false; };
const release = s => { const e = s.ent; s.ent = null; s.done = false; s.rem = 0; return e; };

function step() {
  const c = CFG, N = c.N || 1;
  S.t += DT;
  // 计划干预 & 停机到期
  S.scheduled = S.scheduled.filter(job => { if (job.at <= S.t) { applyAction(job.act, "计划"); return false; } return true; });
  for (const [id, d] of Object.entries(S.down)) if (d.until <= S.t) { delete S.down[id]; logEv(targetName(id) + " 恢复运行", "ok"); }

  /* ---- 人工段（下游先行，腾出空间） ---- */
  const pk = S.srv.pack;
  tickSrv(pk);
  if (pk.ent && pk.done) { release(pk); S.out++; S.outTimes.push(S.t); const h = Math.floor(S.t / 3600); S.hourly[h] = (S.hourly[h] || 0) + 1; }
  if (free(pk) && S.packQ.length && !isDown("pack")) {
    S.packCount++;
    const perBox = c.perLayer * c.layers;
    let tt = vt(c.place);
    c.pack.forEach(p => {
      if (!p.on || !p.t) return;
      if (p.f == 1 || (p.f == 2 && c.perLayer && S.packCount % c.perLayer === 0) || (p.f == 3 && perBox && S.packCount % perBox === 0)) tt += vt(p.t);
    });
    take(pk, S.packQ.shift(), tt);
  }
  const vs = S.srv.visual;
  tickSrv(vs);
  if (vs.ent && vs.done && S.packQ.length < c.buf.pack) S.packQ.push(release(vs));
  if (free(vs) && S.visQ.length && !isDown("visual")) take(vs, S.visQ.shift(), vt(c.visual));
  const un = S.srv.unload;
  tickSrv(un);
  if (un.ent && un.done && S.visQ.length < c.buf.vis) S.visQ.push(release(un));
  if (free(un) && S.unlQ.length && !isDown("unload")) take(un, S.unlQ.shift(), vt(c.unload));

  /* ---- 同步检测线 ---- */
  const ins = inspStations(), I = S.insp, k = ins.length;
  const lineDown = isDown("insp");
  if (k === 0) { if (I.nest && S.unlQ.length < c.buf.unl) { S.unlQ.push(I.nest); I.nest = null; } }
  else if (I.phase === "move") {
    if (lineDown) I.st.down += DT; else { I.st.work += DT; I.rem -= DT; }
    if (I.rem <= 0) {
      if (I.pos[k - 1]) S.unlQ.push(I.pos[k - 1].part);
      for (let j = k - 1; j > 0; j--) I.pos[j] = I.pos[j - 1];
      I.pos[0] = I.nest ? { part: I.nest, rem: 0 } : null; I.nest = null;
      I.pos.forEach((p, j) => { if (p) p.rem = vt(+ins[j].t || 0); });
      I.phase = "work";
    }
    I.posSt.forEach(s => s.idle += DT);
  } else {
    let allDone = true, any = false;
    I.pos.forEach((p, j) => {
      const sd = isDown("insp" + (ins[j].i + 1)) || lineDown, st = I.posSt[j];
      if (sd) st.down += DT;
      else if (p && p.rem > 0) st.work += DT;
      else if (p) st.block += DT;
      else st.idle += DT;
      if (p) { any = true; if (!sd && p.rem > 0) p.rem -= DT; if (p.rem > 0) allDone = false; }
    });
    const canOut = !I.pos[k - 1] || S.unlQ.length < c.buf.unl;
    if ((any || I.nest) && allDone && canOut && !lineDown && !ins.some(s => isDown("insp" + (s.i + 1)))) { I.phase = "move"; I.rem = c.insp.move; }
    if (lineDown) I.st.down += DT; else if (!any && !I.nest) I.st.idle += DT;
  }

  /* ---- 检测线上料机械手 ---- */
  const ld = S.srv.loader, cl = S.cool, exit = cl.groups[cl.G - 1];
  tickSrv(ld);
  if (ld.ent && ld.done && !I.nest && I.phase !== "move") I.nest = release(ld);
  if (free(ld) && exit.length && !cl.idxRem && !isDown("loader") && !isDown("cooler")) {
    const p = exit.shift(); p.coolT = S.t - p.tIn; S.coolTimes.push(p.coolT); if (S.coolTimes.length > 50) S.coolTimes.shift();
    take(ld, p, vt(c.cool.r2));
  }

  /* ---- 冷却通道：装满一组且出口组取空后整体前移一组 ---- */
  const cdn = isDown("cooler");
  if (cl.idxRem > 0) {
    if (cdn) cl.st.down += DT; else { cl.st.work += DT; cl.idxRem -= DT; }
    if (cl.idxRem <= 0) { cl.idxRem = 0; for (let g = cl.G - 1; g > 0; g--) cl.groups[g] = cl.groups[g - 1]; cl.groups[0] = []; cl.lastIdx = S.t; }
  } else {
    if (cdn) cl.st.down += DT;
    else if (cl.groups[0].length >= c.cool.grp && exit.length === 0 && S.t - cl.lastIdx >= (c.cool.minStop || 0)) { cl.idxRem = c.cool.fwd || DT; }
    else if (cl.groups[0].length >= c.cool.grp) cl.st.block += DT;
    else cl.st.idle += DT;
  }

  /* ---- 脱模 ---- */
  const dm = S.srv.demold;
  tickSrv(dm);
  if (dm.ent && dm.done && !cl.idxRem && !cdn && cl.groups[0].length + dm.ent.n <= Math.max(c.cool.grp, dm.ent.n)) {
    const cr = release(dm);
    for (let j = 0; j < cr.n; j++) cl.groups[0].push({ id: S.nextId++, tIn: S.t });
    cr.n = 0;
    if (S.toolDeficit > 0) { S.toolDeficit--; logEv("工装 #" + cr.id + " 下线（减少工装数）", ""); }
    else { cr.rem = c.ret; cr.dur = c.ret; S.ret.push(cr); }
  }
  if (free(dm) && S.demQ.length && !isDown("demold")) take(dm, S.demQ.shift(), vt(c.demold));

  /* ---- 出料主通道（倍速链） ---- */
  if (!isDown("out")) S.out_ = S.out_.filter(cr => { cr.rem -= DT; if (cr.rem <= 0) { S.demQ.push(cr); return false; } return true; });

  /* ---- 固化通道 ---- */
  S.ch.forEach((ch, i) => {
    const on = c.channels[i] && c.channels[i].on, chDown = isDown(`ch${i + 1}`);
    tickSrv(ch.heat, chDown); tickSrv(ch.cool, chDown);
    const exitSrv = c.mode === 2 ? ch.cool : ch.heat;
    if (exitSrv.ent && exitSrv.done && !isDown("out") && S.t - S.lastOut >= c.gapOut) {
      const cr = release(exitSrv); cr.ch = i; cr.rem = c.channels[i].tout; cr.dur = cr.rem; S.out_.push(cr); S.lastOut = S.t;

  });

  /* ---- 进料主通道：按派发策略选通道 ---- */
  if (!isDown("feed")) S.feed = S.feed.filter(cr => {
    cr.rem -= DT;
    if (cr.rem <= 0) { const ch = S.ch[cr.ch]; ch.resv = false; ch.entry = cr; return false; }
    return true;
  });
  if (S.feedQ.length && !isDown("feed") && S.t - S.lastFeed >= c.gapIn) {
    const idx = pickChannel();
    if (idx >= 0) {
      const cr = S.feedQ.shift(); cr.ch = idx; cr.rem = c.channels[idx].tin; cr.dur = cr.rem;

    }
  }

  /* ---- 预压 / 上料 ---- */
  const pr = S.srv.pre;
  tickSrv(pr);
  if (pr.ent && pr.done && S.feedQ.length < c.buf.feedQ) S.feedQ.push(release(pr));
  const lo = S.srv.load;
  tickSrv(lo);
  if (lo.ent && lo.done && free(pr) && !isDown("pre")) take(pr, release(lo), vt(c.pre));
  if (free(lo) && S.retBuf.length && !isDown("load")) { const cr = S.retBuf.shift(); cr.n = N; take(lo, cr, vt(c.load)); }

  /* ---- 空工装回流 ---- */
  if (!isDown("ret")) S.ret = S.ret.filter(cr => { cr.rem -= DT; if (cr.rem <= 0) { S.retBuf.push(cr); return false; } return true; });
}

function pickChannel() {
  const c = CFG, n = c.channels.length;
  const ok = i => c.channels[i].on && !S.ch[i].resv && !S.ch[i].entry && !isDown(`ch${i + 1}.heat`) && !isDown(`ch${i + 1}`);
  if (c.dispatch === "roundrobin") { for (let j = 0; j < n; j++) { const i = (S.rr + j) % n; if (ok(i)) return i; } return -1; }
  if (c.dispatch === "farthest") { for (let i = n - 1; i >= 0; i--) if (ok(i)) return i; return -1; }
  for (let i = 0; i < n; i++) if (ok(i)) return i;
  return -1;
}

/* ================= 目标 / 指令 ================= */
function targetName(id) {

  if (m) return m[1] + "通道" + (m[2] === "heat" ? "加热位" : m[2] === "cool" ? "冷却位" : "(整通道)");
  const mi = /^insp(\d+)$/.exec(id);
  if (mi) { const s = CFG.insp.st[+mi[1] - 1]; return "检测工位" + mi[1] + (s && s.name ? "(" + s.name + ")" : ""); }
  return { load: "上料工位", pre: "预压工位", feed: "进料主通道", out: "出料主通道", demold: "脱模工位", ret: "空工装回流线", cooler: "冷却通道", loader: "检测线上料机械手", insp: "检测线(整线移栽)", unload: "下料", visual: "目检", pack: "装箱" }[id] || id;
}

// 统一动作执行：{op, target, value, minutes, text, at}
function applyAction(a, src = "") {
  if (a.at && a.at > 0) {
    S.scheduled.push({ at: S.t + a.at * 60, act: { ...a, at: 0 } });
    logEv(`已计划：${a.at} 分钟后 ${describe({ ...a, at: 0 })}`, "ai"); return true;
  }

      S.down[a.target] = { until, reason: a.text || "停机" };
      logEv(`${targetName(a.target)} ${a.text || "停机"}${a.minutes > 0 ? "，预计 " + a.minutes + " 分钟" : "，待人工恢复"}`, "ng");

      if (!S.down[a.target]) return fail(targetName(a.target) + " 当前未停机");
      delete S.down[a.target]; logEv(targetName(a.target) + " 恢复运行", "ok"); return true;

    case "set_text":
      if (a.target === "dispatch" && ["nearest", "roundrobin", "farthest"].includes(a.text)) { CFG.dispatch = a.text; logEv("通道派发策略 → " + dispName(a.text), "ai"); saveCfg(); renderCfg(); return true; }
      { const m = /^insp\.(\d+)\.name$/.exec(a.target); if (m && CFG.insp.st[+m[1] - 1]) { CFG.insp.st[+m[1] - 1].name = a.text; saveCfg(); return true; } }
      return fail("无法设置 " + a.target);

      ch.on = a.op === "channel_on"; logEv(`${m[1]}通道 ${ch.on ? "开启" : "关闭（在制工装做完后不再派料）"}`, "ai"); saveCfg(); return true;
    }
    case "speed": setSpeed(+a.value); return true;
    case "run": setRun(true); return true;
    case "pause": setRun(false); return true;
    case "reset": resetSim(); return true;

    case "none": return true;

    set: `${(paramList().find(p => p.key === a.target) || { label: a.target }).label} = ${a.value}`, set_text: `${a.target} = ${a.text}`,

/* ================= 本地指令解析（无 API Key 时） ================= */
function localParse(txt) {
  const acts = [], s = txt.replace(/\s+/g, "");
  let at = 0, m;
  if ((m = /(\d+(?:\.\d+)?)(分钟|min|小时|h)后/.exec(s))) at = +m[1] * (/小时|h/.test(m[2]) ? 60 : 1);
  const body = at ? s.replace(m[0], "") : s;
  let minutes = 0;
  if ((m = /(\d+(?:\.\d+)?)(分钟|min|小时|h)/.exec(body))) minutes = +m[1] * (/小时|h/.test(m[2]) ? 60 : 1);
  const reason = (/(维修|故障|保养|换型|点检|清洁|调试|停机|暂停|停)/.exec(body) || [])[1] || "停机";
  // 目标识别
  const tgts = [];
  const chRe = /(\d+)[#号]?通道(加热|冷却)?/g;
  while ((m = chRe.exec(body))) tgts.push(`ch${m[1]}` + (m[2] === "加热" ? ".heat" : m[2] === "冷却" ? ".cool" : ""));
  const alias = [["检测线上料", "loader"], ["上料机械手", "loader"], ["机械手", "loader"], ["进料主通道", "feed"], ["出料主通道", "out"], ["回流", "ret"],
    ["冷却通道", "cooler"], ["冷却线", "cooler"], ["冷却段", "cooler"], ["检测线", "insp"], ["检测段", "insp"], ["上料", "load"], ["预压", "pre"], ["脱模", "demold"],
    ["下料", "unload"], ["目检", "visual"], ["装箱", "pack"]];
  let rest = body.replace(chRe, "");
  CFG.insp.st.forEach((st, i) => { if (st.on && st.name && rest.includes(st.name)) { tgts.push("insp" + (i + 1)); rest = rest.replace(st.name, ""); } });
  while ((m = /检测工位(\d+)/.exec(rest))) { tgts.push("insp" + m[1]); rest = rest.replace(m[0], ""); }
  for (const [k, id] of alias) if (rest.includes(k)) { tgts.push(id); rest = rest.split(k).join(""); }

  if ((m = /(\d+)倍速|倍速(?:调到|改为|设为)?(\d+)|(\d+)[x×]/.exec(body))) { acts.push({ op: "speed", value: +(m[1] || m[2] || m[3]) }); }
  if (/全部恢复|全线恢复|都恢复/.test(body)) acts.push({ op: "resume", target: "all" });
  else if (/恢复|修好|修复|开机/.test(body) && tgts.length) tgts.forEach(t => acts.push({ op: "resume", target: t }));
  else if (/(开启|打开|启用)/.test(body) && /通道/.test(body) && tgts.length) tgts.forEach(t => acts.push({ op: "channel_on", target: t.split(".")[0] }));
  else if (/(关闭|停用)/.test(body) && /通道/.test(body) && !/维修|故障/.test(body) && tgts.length) tgts.forEach(t => acts.push({ op: "channel_off", target: t.split(".")[0] }));
  else if ((m = /工装(?:数|数量)?(?:改为|改成|设为|调到|调整为|增加到|减少到|=)(\d+)/.exec(body))) acts.push({ op: "set", target: "tools", value: +m[1] });
  else if ((m = /(?:节拍|时间|周期|工时)(?:改为|改成|设为|调到|调整为|缩短到|延长到|=)(\d+(?:\.\d+)?)/.exec(body))) {
    const v = +m[1];
    const map = { load: "load", pre: "pre", demold: "demold", loader: "cool.r2", unload: "unload", visual: "visual", pack: "place", cooler: "cool.fwd", insp: "insp.move", ret: "ret" };

    tgts.forEach(t => { const mi = /^insp(\d+)$/.exec(t); const key = mi ? `insp.${mi[1]}.t` : map[t]; if (key) acts.push({ op: "set", target: key, value: v }); });

  else if (/^(暂停|停止)(模拟)?$/.test(body)) acts.push({ op: "pause" });
  else if (/重置/.test(body)) acts.push({ op: "reset" });
  if ((m = /派发|派料|分配/.exec(body))) {
    const d = /轮流|轮询|均衡/.test(body) ? "roundrobin" : /远/.test(body) ? "farthest" : /近/.test(body) ? "nearest" : "";
    if (d) acts.push({ op: "set_text", target: "dispatch", text: d });
  }
  acts.forEach(a => { a.at = at; });
  return acts;
}

function stateBrief() {
  const th = theory(CFG), r = rollTakt(30), avg = avgTakt();
  const stations = stationRows().map(x => `${x.id}(${x.name}) 状态:${x.state} 作业${pct(x.u.work)} 堵料${pct(x.u.block)} 待料${pct(x.u.idle)} 停机${pct(x.u.down)}`);

  return [

    `产出 ${S.out} 件；近30件实时节拍 ${r ? r.toFixed(1) : "—"} s/件；平均节拍 ${avg ? avg.toFixed(1) : "—"} s/件；理论线体节拍 ${th.LT.toFixed(1)} s/件（${th.src}）；目标节拍 ${th.target ? th.target.toFixed(1) : "未设"}`,

    `通道派发策略：${CFG.dispatch}；工时波动 ${CFG.vari}`,
    `当前停机：${down.length ? down.join("；") : "无"}`,
    `计划中的干预：${S.scheduled.length ? S.scheduled.map(j => fmtDur(j.at - S.t) + "后 " + describe(j.act)).join("；") : "无"}`,
    `工位状态：\n` + stations.join("\n"),

    `可调参数（key = 当前值）：\n` + paramList().map(p => `${p.key} = ${p.value} ${p.unit}  // ${p.label}`).join("\n")

async function askAI(text) {
  const Anthropic = await loadSDK();
  const client = new Anthropic({ apiKey: AI.key, baseURL: AI.base || undefined, dangerouslyAllowBrowser: true });
  const messages = chatHist.slice(-16).concat([{ role: "user", content: `【实时线体状态】\n${stateBrief()}\n\n【技术员指令】\n${text}` }]);
  const resp = await client.beta.messages.create({
    model: AI.model || "claude-opus-5-5",
    max_tokens: 16000,
    betas: ["server-side-fallback-2026-07-01"],
    fallbacks: "default",
    output_config: { effort: "medium" },
    system: AI_SYSTEM,
    tools: [AI_TOOL],
    messages
  });
  if (resp.stop_reason === "refusal") return { reply: "模型拒绝了这条请求" + (resp.stop_details && resp.stop_details.explanation ? "：" + resp.stop_details.explanation : "") + "。", actions: [] };
  let out = null, txt = "";
  for (const b of resp.content) {
    if (b.type === "tool_use" && b.name === "apply_actions") out = b.input;
    else if (b.type === "text") txt += b.text;
  }
  if (!out) out = { reply: txt || "（无答复）", actions: [] };
  if (!Array.isArray(out.actions)) out.actions = [];
  return out;
}

async function send(text) {
  text = text.trim(); if (!text) return;
  addMsg("u", text);
  const useAI = !!AI.key;
  let res;
  if (useAI) {
    const pending = addMsg("sys", "Claude 思考中…");
    try { res = await askAI(text); res.src = "Claude"; }
    catch (e) {
      const acts = localParse(text);
      res = { reply: `AI 接口调用失败（${e && e.message ? e.message : e}），已改用本地规则解析。`, actions: acts, src: "本地解析" };
    }
    pending.remove();
  } else {
    const acts = localParse(text);
    res = { reply: acts.length ? "已按本地规则解析执行。" : "本地规则未识别这条指令。可换个说法（例：「3通道冷却位故障停机20分钟」「上料节拍改为70」「5分钟后预压保养10分钟」），或在上方填入 API Key 由 Claude 理解。", actions: acts, src: "本地解析" };
  }
  const done = res.actions.map(a => (applyAction(a, res.src) ? "✓ " : "✗ ") + (a.at ? a.at + "分钟后 " : "") + describe(a));
  addMsg("a", res.reply, done, res.src);
  chatHist.push({ role: "user", content: text }, { role: "assistant", content: res.reply + (done.length ? "\n已执行：" + done.join("；") : "") });
  renderAll();
}

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

}

/* ================= 统计 / 看板 ================= */
const pct = x => isFinite(x) ? Math.round(x * 100) + "%" : "—";
function fmtClock(s) { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0"); }
function fmtDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}小时${m}分` : `${m}分${s % 60}秒`; }
function clockText() {
  const abs = 8 * 3600 + S.t, day = Math.floor((abs - 8 * 3600) / 86400) + 1, sec = Math.floor(abs % 86400);
  const hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const shift = hh >= 8 && hh < 20 ? "白班" : "夜班";
  return `第${day}天 ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")} ${shift}`;
}
function rollTakt(n) { const o = S.outTimes; if (o.length < n + 1) return 0; return (o[o.length - 1] - o[o.length - 1 - n]) / n; }
function avgTakt() { const o = S.outTimes; if (o.length < 6) return 0; const from = Math.min(5, o.length - 2); return (o[o.length - 1] - o[from]) / (o.length - 1 - from); }
function utilOf(st) { const tot = st.work + st.block + st.idle + st.down || 1; return { work: st.work / tot, block: st.block / tot, idle: st.idle / tot, down: st.down / tot }; }
function stationRows() {
  const rows = [];
  const push = (id, name, st, state) => rows.push({ id, name, u: utilOf(st), state });
  const sName = { work: "作业", block: "堵料", idle: "待料", down: "停机" };
  ["load", "pre"].forEach(id => push(id, S.srv[id].name, S.srv[id].st, sName[srvState(S.srv[id])]));
  S.ch.forEach((ch, i) => { if (!CFG.channels[i].on && !ch.heat.ent && !ch.cool.ent) return; const st = {}; ["work", "block", "idle", "down"].forEach(k => st[k] = ch.heat.st[k] + (CFG.mode === 2 ? ch.cool.st[k] : 0)); push(`ch${i + 1}`, `${i + 1}通道`, st, sName[srvState(ch.heat, isDown(`ch${i + 1}`))] + "/" + (CFG.mode === 2 ? sName[srvState(ch.cool, isDown(`ch${i + 1}`))] : "")); });
  push("demold", "脱模工位", S.srv.demold.st, sName[srvState(S.srv.demold)]);
  push("cooler", "冷却通道(前移)", S.cool.st, isDown("cooler") ? "停机" : S.cool.idxRem ? "前移" : "—");
  push("loader", "检测上料机械手", S.srv.loader.st, sName[srvState(S.srv.loader)]);
  inspStations().forEach((s, j) => push("insp" + (s.i + 1), "检测·" + (s.name || s.i + 1), S.insp.posSt[j], isDown("insp" + (s.i + 1)) ? "停机" : S.insp.pos[j] ? (S.insp.pos[j].rem > 0 ? "作业" : "等移栽") : "空"));
  ["unload", "visual", "pack"].forEach(id => push(id, S.srv[id].name, S.srv[id].st, sName[srvState(S.srv[id])]));
  return rows;
}
function renderDash() {

  const wipTools = CFG.tools - S.retBuf.length;

}

// 读取《节拍分析表》9.2 基础数据录入（固化线 15 列版单元格位置）
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("加载失败 " + src)); document.head.appendChild(s); }); }
async function importXlsx(file) {
  try {
    if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const ws = wb.Sheets["9.2 基础数据录入"];
    if (!ws) throw new Error("没有找到「9.2 基础数据录入」工作表");
    const v = a => { const c = ws[a]; return c ? c.v : undefined; };
    const n = (a, d = 0) => { const x = parseFloat(v(a)); return isFinite(x) ? x : d; };
    if (!/固化/.test(String(v("B2") || "")) && v("E57") === undefined) throw new Error("该表不是自粘钢固化线节拍分析表（9.2 区结构不符）");
    const c = clone(DEFAULT_CFG);
    const title = String(v("B2") || ""), title2 = String((wb.Sheets["过程确认"] || {})["B30"] ? wb.Sheets["过程确认"]["B30"].v : "");
    c.name = title2 || (/转子/.test(title) ? "转子自粘钢固化线" : "定子自粘钢固化线");
    c.demand = { dem: n("E10"), use: n("E11", 1), days: n("E13", 26), mins: n("E14", 1320), oee: n("E15", 0.85) };
    c.mode = n("E25", 2) === 1 ? 1 : 2;
    c.N = n("E27", 1) || 1;
    c.Tch = n("E26") > 0 ? n("E26") : (c.mode === 2 ? Math.max(n("E23"), n("E24")) : n("E23") + n("E24"));
    c.channels = [];
    for (let r = 36; r <= 45; r++) c.channels.push({ on: n("C" + r) === 1, tin: n("D" + r), tout: n("E" + r) });
    c.gapIn = n("E48"); c.gapOut = n("E49"); c.load = n("E57"); c.pre = n("E59"); c.demold = n("E61"); c.ret = n("E67"); c.tools = n("E69", 20);
    c.cool = { rows: n("E82", 3), cols: n("E83", 16), grp: n("E84", 6), fwd: n("E85"), minStop: n("E86"), r1: n("E87"), r2: n("E88"), req: n("E93") };
    c.insp.move = n("E100");
    c.insp.st = [];
    for (let r = 102; r <= 107; r++) c.insp.st.push({ on: n("C" + r) === 1, name: String(v("D" + r) || ""), t: n("E" + r) });
    c.unload = n("E116"); c.visual = n("E117"); c.place = n("E118"); c.perLayer = n("E119", 1); c.layers = n("E120", 1);
    c.pack = [];
    for (let r = 125; r <= 134; r++) { const nm = v("D" + r); if (nm === undefined && !n("E" + r)) continue; c.pack.push({ on: n("C" + r) === 1, name: String(nm || ""), t: n("E" + r), f: n("F" + r, 1) }); }
    CFG = c; saveCfg(); resetSim(); renderAll();
    logEv(`已导入「${file.name}」：T_ch ${c.Tch}s，${c.channels.filter(x => x.on).length} 通道，工装 ${c.tools} 套，N=${c.N}`, "ok");
  } catch (err) { alert("导入失败：" + err.message); }
}

/* ================= 日志 / 聊天 UI ================= */
function logEv(msg, cls) {
  const L = (S && S.log) || []; L.push({ t: S ? S.t : 0, msg, cls }); if (L.length > 400) L.shift();
  if (S) S.log = L;
  const el = document.getElementById("p-log");
  if (el && !el.classList.contains("hidden")) renderLog();
}
function renderLog() {
  document.getElementById("p-log").innerHTML = (S.log || []).slice().reverse().map(e => `<div class="${e.cls || ""}"><b>${fmtClock(e.t)}</b>${esc(e.msg)}</div>`).join("") || '<div class="sub">暂无事件</div>';
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function addMsg(cls, text, acts, src) {
  const d = document.createElement("div"); d.className = "msg " + cls;
  d.innerHTML = esc(text) + (acts && acts.length ? `<div class="acts">${acts.map(esc).join("<br>")}</div>` : "") + (src ? `<div class="acts">— ${esc(src)} · ${clockText()}</div>` : "");
  const ch = document.getElementById("chat"); ch.appendChild(d); ch.parentElement.scrollTop = 1e9; return d;
}

/* ================= 主循环 ================= */
let SPEED = 60, lastFrame = 0, acc = 0;
function setSpeed(x) { if (!(x > 0)) return; SPEED = Math.min(3000, x); const sel = document.getElementById("speed"); if (![...sel.options].some(o => +o.value === SPEED)) sel.add(new Option(SPEED, SPEED)); sel.value = SPEED; logEv("倍速 " + SPEED + "×", ""); }
function setRun(on) { S.running = on; document.getElementById("btnRun").textContent = on ? "⏸ 暂停" : "▶ 运行"; }
function fastForward(sec) { const n = Math.round(sec / DT); for (let i = 0; i < n; i++) step(); logEv("快进 " + fmtDur(sec), ""); renderAll(); }
let uiTick = 0;
function frame(ts) {
  const dt = lastFrame ? Math.min(0.1, (ts - lastFrame) / 1000) : 0; lastFrame = ts;
  if (S.running) {
    acc += dt * SPEED;
    let n = 0; while (acc >= DT && n < 6000) { step(); acc -= DT; n++; }
    if (n >= 6000) acc = 0;
  }
  draw();
  document.getElementById("clock").innerHTML = clockText() + `<small>已运行 ${fmtDur(S.t)}</small>`;
  if (ts - uiTick > 500) { uiTick = ts; if (!document.getElementById("p-dash").classList.contains("hidden")) renderDash(); if (!document.getElementById("p-log").classList.contains("hidden")) renderLog(); updatePop(); }
  requestAnimationFrame(frame);
}
function renderAll() { document.getElementById("lineName").textContent = CFG.name + " · 流转模拟"; renderDash(); renderCfg(); renderLog(); }
function saveCfg() { store.set("lsx-sim-cfg", CFG); }

/* ---- 点击工位弹窗 ---- */
let popId = null;
function updatePop() {
  const pop = document.getElementById("pop");
  if (!popId) { pop.classList.add("hidden"); return; }
  const d = S.down[popId];
  const row = stationRows().find(r => r.id === popId || r.id === popId.split(".")[0]);
  pop.querySelector(".pi").innerHTML = `${d ? `<span style="color:var(--ng)">${d.reason}中 · ${d.until === Infinity ? "待恢复" : "剩 " + fmtClock(d.until - S.t)}</span><br>` : ""}${row ? `作业率 ${pct(row.u.work)} · 堵料 ${pct(row.u.block)} · 待料 ${pct(row.u.idle)} · 停机 ${pct(row.u.down)}` : ""}`;
}
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - offX) / scale, y = (e.clientY - r.top - offY) / scale;
  const h = HIT.slice().reverse().find(o => x >= o.r.x && x <= o.r.x + o.r.w && y >= o.r.y && y <= o.r.y + o.r.h);
  const pop = document.getElementById("pop");
  if (!h) { popId = null; pop.classList.add("hidden"); return; }
  popId = h.id;
  pop.innerHTML = `<h4>${targetName(h.id)}</h4><div class="pi sub"></div>
    <div class="row"><button class="sm" data-m="10">停 10 分钟</button><button class="sm" data-m="30">停 30 分钟</button><button class="sm" data-m="0">停机待恢复</button><button class="sm" data-r="1">恢复</button><button class="sm" data-x="1">关闭</button></div>`;
  const stage = cv.parentElement.getBoundingClientRect();
  pop.style.left = Math.min(stage.width - 260, e.clientX - stage.left + 8) + "px"; pop.style.top = Math.min(stage.height - 140, e.clientY - stage.top + 8) + "px";
  pop.classList.remove("hidden");
  pop.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { applyAction({ op: "stop", target: h.id, minutes: +b.dataset.m, text: "停机" }); updatePop(); });
  pop.querySelector("[data-r]").onclick = () => { applyAction({ op: "resume", target: h.id }); updatePop(); };
  pop.querySelector("[data-x]").onclick = () => { popId = null; pop.classList.add("hidden"); };
  updatePop();
});

/* ---- 绑定 ---- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("hidden", p.id !== "p-" + b.dataset.tab));
  if (b.dataset.tab === "log") renderLog(); if (b.dataset.tab === "dash") renderDash();
});
document.getElementById("btnRun").onclick = () => setRun(!S.running);
document.getElementById("btnReset").onclick = () => { resetSim(); renderAll(); };
document.getElementById("speed").onchange = e => { SPEED = +e.target.value; };
document.getElementById("btnFF").onclick = () => fastForward(3600);
document.getElementById("send").onclick = () => { const t = document.getElementById("ask"); send(t.value); t.value = ""; };
document.getElementById("ask").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("send").click(); } });
const CHIPS = ["1通道加热工位维修，暂停运行15分钟", "脱模工位故障停机20分钟", "10分钟后预压保养5分钟", "上料节拍改为70", "工装数改为40", "通道派发改为轮流", "全部恢复", "600倍速"];
document.getElementById("chips").innerHTML = CHIPS.map(c => `<button>${c}</button>`).join("") + `<button data-q="1">现在瓶颈在哪？</button>`;
document.querySelectorAll("#chips button").forEach(b => b.onclick = () => { document.getElementById("ask").value = b.textContent; document.getElementById("ask").focus(); });
function syncAiUi() {
  document.getElementById("aiKey").value = AI.key; document.getElementById("aiBase").value = AI.base; document.getElementById("aiModel").value = AI.model;
  document.getElementById("aiMode").textContent = AI.key ? "Claude 已连接" : "本地指令解析";
}
document.getElementById("aiSave").onclick = () => { AI.key = document.getElementById("aiKey").value.trim(); AI.base = document.getElementById("aiBase").value.trim(); AI.model = document.getElementById("aiModel").value.trim() || "claude-opus-5-5"; store.set("lsx-sim-ai", AI); syncAiUi(); addMsg("sys", AI.key ? "已保存，后续指令由 Claude 处理。" : "未填 Key，使用本地规则解析。"); };
document.getElementById("aiClear").onclick = () => { AI.key = ""; store.set("lsx-sim-ai", AI); syncAiUi(); };
window.addEventListener("resize", resize);

resetSim(); syncAiUi(); renderAll(); resize();
addMsg("sys", "在下方用中文下指令干预线体，例如「1通道加热工位维修，暂停运行15分钟」。点击画面中的工位也可直接停机/恢复。");
requestAnimationFrame(frame);
</script>
</body>
